name: Deploy to GCE

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  ZONE: us-central1-f
  INSTANCE: relayman-vm          # change to your GCE instance name
  DEPLOY_PATH: /opt/relayman     # path on the VM where the repo is cloned

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to GCP ──────────────────────────────────────────────
      # Option A (recommended): Workload Identity Federation — no long-lived key
      # Setup guide: https://github.com/google-github-actions/auth#workload-identity-federation
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── Deploy to Compute Engine via IAP tunnel ──────────────────────────
      # The service account needs roles: compute.osLogin (or compute.osAdminLogin)
      # and iap.tunnelResourceAccessor on the instance.
      - name: Deploy
        run: |
          gcloud compute ssh ${{ env.INSTANCE }} \
            --zone=${{ env.ZONE }} \
            --tunnel-through-iap \
            --command="
              set -e
              cd ${{ env.DEPLOY_PATH }}

              echo '--- Pulling latest code ---'
              git pull origin main

              echo '--- Authenticating Docker to Artifact Registry ---'
              gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

              echo '--- Rebuilding and restarting containers ---'
              docker compose up --build -d --remove-orphans

              echo '--- Pruning unused images ---'
              docker image prune -f

              echo '--- Done ---'
            "
