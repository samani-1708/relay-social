version: '3.9'

# ┌─────────────────────────────────────────────────────────────────────────┐
# │  MONOLITH — everything on one GCP Compute Engine VM                    │
# │                                                                         │
# │  Run (full monolith):                                                   │
# │    docker compose --profile local-db --profile local-redis \           │
# │                   --profile local-storage up -d                         │
# │                                                                         │
# │  Switching to a managed cloud service tomorrow:                         │
# │    • Cloud SQL      → drop --profile local-db,  set DATABASE_URL       │
# │    • Cloud Memstore → drop --profile local-redis, set REDIS_URL        │
# │    • GCS            → drop --profile local-storage,                    │
# │                        set STORAGE_PROVIDER=gcs + GCS_* vars           │
# │                                                                         │
# │  App services (api, web, nginx) always start regardless of profiles.   │
# └─────────────────────────────────────────────────────────────────────────┘

services:

  # ── Local infrastructure (profile-gated — remove when moving to cloud) ──

  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: relayman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relayman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relayman}
      POSTGRES_DB: ${POSTGRES_DB:-relayman}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-relayman}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: [local-redis]
    image: redis:7-alpine
    container_name: relayman-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: [local-storage]
    image: quay.io/minio/minio:latest
    container_name: relayman-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'   # S3 API  — open this port in GCP firewall rules
      - '9001:9001'   # Web console (restrict to your IP in production)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket and grants public-read
  minio-init:
    profiles: [local-storage]
    image: quay.io/minio/mc:latest
    container_name: relayman-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/relayman-media &&
        mc anonymous set download local/relayman-media &&
        echo 'MinIO bucket ready.'
      "
    restart: on-failure

  # ── Application services (always start) ───────────────────────────────

  # Run Prisma migrations before the API boots
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: relayman-api-migrate
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # skipped when local-db profile is inactive (Cloud SQL mode)
    environment:
      # Local monolith: postgresql://relayman:relayman@postgres:5432/relayman
      # Cloud SQL (private IP): postgresql://user:pass@<PRIVATE_IP>:5432/relayman
      DATABASE_URL: ${DATABASE_URL:-postgresql://relayman:relayman@postgres:5432/relayman}
    entrypoint:
      - npx
      - prisma
      - migrate
      - deploy
      - --schema
      - apps/api/prisma/schema.prisma

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: relayman-api
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false   # skipped when local-redis profile is inactive (Memorystore mode)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: --dns-result-order=ipv4first

      # ── Database ──────────────────────────────────────────────────────
      # Local monolith: postgresql://relayman:relayman@postgres:5432/relayman
      # Cloud SQL (private IP): postgresql://user:pass@<PRIVATE_IP>:5432/relayman
      DATABASE_URL: ${DATABASE_URL:-postgresql://relayman:relayman@postgres:5432/relayman}

      # ── Cache / Queue ─────────────────────────────────────────────────
      # Local:            redis://redis:6379
      # Cloud Memorystore: redis://<MEMORYSTORE_IP>:6379
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      APP_NAME: ${APP_NAME:-relayman}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}

      # ── Storage ───────────────────────────────────────────────────────
      # Local MinIO:  STORAGE_PROVIDER=s3  (default)
      # GCS:          STORAGE_PROVIDER=gcs + GCS_PROJECT_ID + GCS_BUCKET
      #               GCS_KEY_FILE can be empty on GCE — ADC picks up the VM service account
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-gcs}

      # S3 / MinIO vars (ignored when STORAGE_PROVIDER=gcs)
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-relayman-media}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}

      # GCS vars (ignored when STORAGE_PROVIDER=s3)
      # On GCE, leave GCS_KEY_FILE empty — the VM service account is used via ADC
      GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-relayman-media}
      GCS_KEY_FILE: ${GCS_KEY_FILE:-}

      # Misc
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # LinkedIn
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}

      # Twitter
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      TWITTER_CALLBACK_URL: ${TWITTER_CALLBACK_URL:-}

      # Meta
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}

      # YouTube
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_CALLBACK_URL: ${YOUTUBE_CALLBACK_URL:-}

      # TikTok
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by Next.js — must be ARGs
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: relayman-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3000:3000'

  nginx:
    image: nginx:alpine
    container_name: relayman-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
